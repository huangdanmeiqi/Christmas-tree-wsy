<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Merry Christmas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Noto+Serif+SC:wght@400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#05030f;font-family:"Noto Serif SC",serif;color:#f3eaff;user-select:none;-webkit-user-select:none}

/* 梦幻背景：缓慢流动的极光 */
.sky{position:fixed;inset:-20%;pointer-events:none;
  background:
    radial-gradient(40% 35% at 25% 30%, rgba(140,90,255,.30), transparent 70%),
    radial-gradient(45% 40% at 75% 25%, rgba(255,120,200,.20), transparent 70%),
    radial-gradient(50% 40% at 60% 80%, rgba(70,200,255,.18), transparent 70%),
    radial-gradient(60% 50% at 50% 55%, #160c38 0%, #0a0620 55%, #04020c 100%);
  filter:blur(30px);animation:drift 26s ease-in-out infinite alternate}
@keyframes drift{0%{transform:translate(0,0) scale(1)}50%{transform:translate(3%,-2%) scale(1.06)}100%{transform:translate(-3%,2%) scale(1.03)}}
#gl{position:fixed;inset:0;width:100%;height:100%;touch-action:none}
.vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 50%,rgba(0,0,0,.6) 100%)}

/* 左上角小镜头预览（可在 CONFIG 里关掉） */
#cam{position:fixed;left:14px;top:14px;width:120px;border-radius:12px;overflow:hidden;opacity:0;transition:opacity .8s;
  border:1px solid rgba(220,200,255,.25);box-shadow:0 8px 24px rgba(0,0,0,.4);pointer-events:none}
#cam.show{opacity:.55}
#cam canvas{display:block;width:100%;transform:scaleX(-1)}
#video{display:none}

/* 只在加载、出错时短暂出现的提示 */
#toast{position:fixed;left:50%;bottom:8%;transform:translateX(-50%);font-size:13px;letter-spacing:.2em;color:rgba(243,234,255,.7);
  text-align:center;line-height:2;opacity:0;transition:opacity 1.2s;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1}
</style>
</head>
<body>
<div class="sky"></div>
<canvas id="gl"></canvas>
<div class="vignette"></div>
<div id="cam"><canvas id="camCanvas" width="240" height="180"></canvas></div>
<video id="video" playsinline muted></video>

<script>
/* =========================================================
   ✏️ CONFIG
   ========================================================= */
const CONFIG = {
  // 手指捏一下时出现的字：[文字, 大小比例, 字体(可省略)]
  lines: [["Merry Christmas", 1], ["WSY", 0.42, '"Noto Serif SC", serif']],                    // 横屏
  portraitLines: [["Merry", 1], ["Christmas", 1], ["WSY", 0.42, '"Noto Serif SC", serif']],   // 竖屏
  textFont: '"Great Vibes", cursive',       // 默认字体（Merry Christmas 用的手写体）
  photo: "photo.jpg",                       // 双手合十时出现的照片，放在 index.html 旁边
  photoHold: 6000,                          // 照片停留多久（毫秒）
  textHold: 5000,                           // 文字停留多久（毫秒）
  showCamera: true,                         // 左上角显示小镜头画面（方便看手有没有被识别）
  rotateSpeed: 1.0,                         // 手左右移时的旋转速度
  flipRotate: false,                        // 如果觉得左右方向反了，改成 true
};
/* ========================= CONFIG 结束 ========================= */

const canvas = document.getElementById("gl");
const gl = canvas.getContext("webgl", {antialias: false, alpha: true, premultipliedAlpha: true});
let toastTimer;
function toast(){}   // 不显示任何文字提示
if (!gl){ toast("你的浏览器不支持 WebGL", 0); throw new Error("no webgl"); }

const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || innerWidth < 700;
const PR = Math.min(devicePixelRatio || 1, 2);
const rand = (a = 0, b = 1) => a + Math.random() * (b - a);
const gauss = () => { let u = 0, v = 0; while (!u) u = Math.random(); while (!v) v = Math.random(); return Math.sqrt(-2*Math.log(u)) * Math.cos(6.2832*v); };
const hex = h => [parseInt(h.slice(1,3),16)/255, parseInt(h.slice(3,5),16)/255, parseInt(h.slice(5,7),16)/255];

/* ---------- 粒子 ---------- */
const TREE_H = 9, TREE_BOTTOM = -4.6, TREE_R = 3.6;
const KIND = {FILL:0, GARLAND:1, ORN:2, STAR:3, RING:4, DUST:5, BOKEH:6, PHOTO:7};
const P = {tree:[], scatter:[], color:[], info:[]};   // info = size, seed, kind, param

const radiusAt = y01 => TREE_R * (1 - y01) * (0.74 + 0.26 * (1 - ((y01 * 7) % 1)));
function scatterPoint(){
  const r = 2.5 + Math.pow(Math.random(), 0.7) * 15;
  const a = Math.floor(Math.random() * 3) * 2.094 + r * 0.36 + gauss() * 0.35;
  return [Math.cos(a) * r, gauss() * (1.8 - r * 0.06) + 0.8, Math.sin(a) * r];
}
function add(tree, color, size, kind, param = 0, scatter = null){
  P.tree.push(...tree); P.scatter.push(...(scatter || scatterPoint()));
  P.color.push(...color); P.info.push(size, Math.random(), kind, param);
}

// 树身（颜色在着色器里按高度做冰蓝→薰衣草→粉的渐变，这里只存亮度）
const nFill = isMobile ? 7000 : 13000;
for (let i = 0; i < nFill; i++){
  const y01 = 1 - Math.cbrt(Math.random()), R = radiusAt(y01);
  const r = R * Math.pow(Math.random(), 0.32), a = rand(0, 6.2832);
  const k = 0.35 + 0.75 * (r / Math.max(R, .001));
  add([Math.cos(a) * r, TREE_BOTTOM + y01 * TREE_H, Math.sin(a) * r], [k, k, k], rand(1.4, 2.6), KIND.FILL, y01);
}
// 螺旋光带（银白色、带彩虹光泽，会流动）
const nGar = isMobile ? 2600 : 4000;
for (let i = 0; i < nGar; i++){
  const t = i / nGar, y01 = t * 0.96, a = t * 7.5 * 6.2832, R = TREE_R * (1 - y01) + 0.1;
  add([Math.cos(a) * R + gauss()*.06, TREE_BOTTOM + y01 * TREE_H + gauss()*.06, Math.sin(a) * R + gauss()*.06],
      [1, 1, 1], rand(2.2, 3.4), KIND.GARLAND, t);
}
// 珍珠挂饰
const pearls = ["#ffffff", "#e9dcff", "#d4c2ff", "#f3e8ff", "#ffe3f6", "#c9b6ff"].map(hex);
for (let i = 0; i < 300; i++){
  const y01 = Math.pow(Math.random(), 1.2) * 0.9, a = rand(0, 6.2832), R = radiusAt(y01) * 0.98;
  add([Math.cos(a) * R, TREE_BOTTOM + y01 * TREE_H, Math.sin(a) * R], pearls[i % pearls.length], rand(6, 10), KIND.ORN);
}
// 五角星 + 光晕
const STAR_Y = TREE_BOTTOM + TREE_H + 0.55;
function inStar(x, y, ro = 0.62, ri = 0.26){
  const a = Math.atan2(x, y), r = Math.hypot(x, y), seg = 6.2832 / 5, k = ((a % seg) + seg) % seg / seg;
  return r < (k < .5 ? ro + (ri - ro) * k * 2 : ri + (ro - ri) * (k - .5) * 2) * .98;
}
for (let n = 0; n < (isMobile ? 700 : 1100);){
  const x = rand(-.65, .65), y = rand(-.65, .65);
  if (inStar(x, y)){ add([x, STAR_Y + y, rand(-.06, .06)], [1, .97, 1], rand(2, 3.4), KIND.STAR); n++; }
}
[[.9,.78,1],[.8,.72,1],[1,.92,1],[.85,.75,1],[1,1,1]].forEach((c, i) => add([0, STAR_Y, 0], c, 40 + i * 18, KIND.STAR, 1, [0, .8, 0]));
// 底部光环
for (let i = 0, n = isMobile ? 1300 : 2200; i < n; i++){
  const a = rand(0, 6.2832), r = 3.8 + Math.abs(gauss()) * 1.5;
  add([Math.cos(a) * r, TREE_BOTTOM - .15 + gauss() * .04, Math.sin(a) * r], [.6, .55, .9], rand(1.3, 2.3), KIND.RING, Math.random());
}
// 漂浮的星尘 / 雪
for (let i = 0, n = isMobile ? 1400 : 2600; i < n; i++)
  add([rand(-18, 18), rand(-10, 10), rand(-16, 8)], [1, 1, 1], rand(1.2, 3.0), KIND.DUST, 0, [0,0,0]);
// 远处的散景光斑
const bokehCols = ["#a07bff", "#c9a8ff", "#8f7bff", "#e0c8ff", "#ffc6ee"].map(hex);
for (let i = 0; i < 46; i++)
  add([rand(-26, 26), rand(-14, 14), rand(-38, -18)], bokehCols[i % bokehCols.length], rand(90, 220), KIND.BOKEH, 0, [0,0,0]);

// 只在照片模式出现的额外粒子（平时看不见），让照片更细腻
for (let i = 0, n = isMobile ? 7000 : 16000; i < n; i++){
  const y01 = Math.random(), R0 = radiusAt(y01) * Math.sqrt(Math.random()), a = rand(0, 6.2832);
  add([Math.cos(a) * R0, TREE_BOTTOM + y01 * TREE_H, Math.sin(a) * R0], [1, 1, 1], rand(1.2, 2.0), KIND.PHOTO);
}

const COUNT = P.info.length / 4;

/* ---------- 文字 ---------- */
const textArr = new Float32Array(COUNT * 3);
function buildText(){
  const portrait = innerWidth < innerHeight;
  const lines = portrait ? CONFIG.portraitLines : CONFIG.lines;
  const W = 1400, lineH = 300;
  const H = Math.round(lines.reduce((h, l) => h + lineH * (l[1] || 1), 0) + 80);
  const cv = document.createElement("canvas"); cv.width = W; cv.height = H;
  const x = cv.getContext("2d");
  x.fillStyle = "#fff"; x.textAlign = "center"; x.textBaseline = "middle";
  let fs = 270;
  const fontOf = (l, f) => `${f * (l[1] || 1)}px ${l[2] || CONFIG.textFont}`;
  const mw = Math.max(...lines.map(l => { x.font = fontOf(l, fs); return x.measureText(l[0]).width; }));
  if (mw > W * .92) fs *= W * .92 / mw;
  let yy = 40;
  lines.forEach(l => { const h = lineH * (l[1] || 1); x.font = fontOf(l, fs); x.fillText(l[0], W / 2, yy + h / 2); yy += h; });
  const d = x.getImageData(0, 0, W, H).data, pts = [];
  for (let py = 0; py < H; py += 3) for (let px = 0; px < W; px += 3) if (d[(py * W + px) * 4 + 3] > 120) pts.push([px, py]);
  for (let i = pts.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [pts[i], pts[j]] = [pts[j], pts[i]]; }
  const vh = 2 * camDist * Math.tan(FOV / 2), vw = vh * innerWidth / innerHeight;
  const worldW = Math.min(vw * .86, 22), worldH = worldW * H / W;
  for (let i = 0; i < COUNT; i++){
    const p = pts.length ? pts[i % pts.length] : [W/2, H/2];
    textArr[i*3] = (p[0] / W - .5) * worldW + gauss() * .025;
    textArr[i*3+1] = -(p[1] / H - .5) * worldH + 1.2 + gauss() * .025;
    textArr[i*3+2] = gauss() * .12;
  }
  if (textBuf){ gl.bindBuffer(gl.ARRAY_BUFFER, textBuf); gl.bufferSubData(gl.ARRAY_BUFFER, 0, textArr); }
}

/* ---------- 照片 → 粒子（亮的地方粒子多又亮，暗的地方稀又暗） ---------- */
const photoArr = new Float32Array(COUNT * 4);
let photoSamples = null, photoAspect = 1, photoBuf = null, photoReady = false;
function loadPhoto(){
  const img = new Image();
  img.onload = () => {
    const S = 220, w = img.width >= img.height ? S : Math.round(S * img.width / img.height), h = img.width >= img.height ? Math.round(S * img.height / img.width) : S;
    photoAspect = w / h;
    const cv = document.createElement("canvas"); cv.width = w; cv.height = h;
    const x = cv.getContext("2d"); x.drawImage(img, 0, 0, w, h);
    let data;
    try { data = x.getImageData(0, 0, w, h).data; } catch(e){ console.warn("照片读取失败：请用 Live Server 或 https 打开", e); return; }
    // 亮度图 + 轻微锐化（让五官、轮廓更清楚）
    const lum = new Float32Array(w * h), blur = new Float32Array(w * h);
    for (let i = 0; i < w * h; i++) lum[i] = (0.299 * data[i*4] + 0.587 * data[i*4+1] + 0.114 * data[i*4+2]) / 255;
    const K = 3;
    for (let y = 0; y < h; y++) for (let x0 = 0; x0 < w; x0++){
      let sum = 0, n = 0;
      for (let dy = -K; dy <= K; dy++) for (let dx = -K; dx <= K; dx++){
        const xx = x0 + dx, yy = y + dy; if (xx < 0 || yy < 0 || xx >= w || yy >= h) continue; sum += lum[yy * w + xx]; n++;
      }
      blur[y * w + x0] = sum / n;
    }
    const lumAt = (px, py) => { const i = py * w + px; return Math.min(1, Math.max(0, lum[i] + 1.6 * (lum[i] - blur[i]))); };
    photoSamples = [];
    let guard = 0;
    while (photoSamples.length < COUNT && guard++ < COUNT * 60){
      const u = Math.random(), v = Math.random();
      const px = Math.min(w - 1, Math.floor(u * w)), py = Math.min(h - 1, Math.floor(v * h));
      let L = lumAt(px, py);
      L = Math.min(1, Math.max(0, (L - 0.06) / 0.88));                 // 拉开明暗对比
      const edge = Math.min(u, 1 - u, v, 1 - v);                          // 四周慢慢淡出，像浮在空中
      L *= Math.min(1, edge / 0.12);
      if (Math.random() < 0.05 + Math.pow(L, 1.5) * 0.95) photoSamples.push([u, v, L]);
    }
    while (photoSamples.length < COUNT) photoSamples.push([Math.random(), Math.random(), 0]);
    for (let i = photoSamples.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [photoSamples[i], photoSamples[j]] = [photoSamples[j], photoSamples[i]]; }
    photoReady = true; layoutPhoto();
  };
  img.onerror = () => console.warn("找不到照片：" + CONFIG.photo);
  img.src = CONFIG.photo;
}
function layoutPhoto(){
  if (!photoSamples) return;
  const vh = 2 * camDist * Math.tan(FOV / 2), vw = vh * innerWidth / innerHeight;
  let hh = vh * 0.8, ww = hh * photoAspect;
  if (ww > vw * 0.86){ ww = vw * 0.86; hh = ww / photoAspect; }
  for (let i = 0; i < COUNT; i++){
    const [u, v, L] = photoSamples[i];
    photoArr[i*4]   = (u - .5) * ww + gauss() * .015;
    photoArr[i*4+1] = -(v - .5) * hh + 0.9 + gauss() * .015;
    photoArr[i*4+2] = gauss() * .08;
    photoArr[i*4+3] = L;
  }
  if (photoBuf){ gl.bindBuffer(gl.ARRAY_BUFFER, photoBuf); gl.bufferSubData(gl.ARRAY_BUFFER, 0, photoArr); }
}

/* ---------- 着色器 ---------- */
const VS = `
attribute vec3 aTree, aScatter, aText, aColor;
attribute vec4 aInfo;
attribute vec4 aPhoto;
uniform mat4 uProj, uView;
uniform float uTime, uYaw, uScatter, uText, uPhoto, uPR, uH;
varying vec3 vColor;
varying float vSoft;
vec2 rot(vec2 v, float a){ float c = cos(a), s = sin(a); return vec2(c*v.x - s*v.y, s*v.x + c*v.y); }
// 淡紫色系：薰衣草 → 丁香紫 → 浅藕紫 → 珍珠白
vec3 dream(float t){
  vec3 a = vec3(0.55, 0.45, 1.00), b = vec3(0.74, 0.60, 1.00), c = vec3(0.88, 0.76, 1.00), d = vec3(1.0, 0.96, 1.0);
  t = clamp(t, 0.0, 1.0);
  if (t < 0.4) return mix(a, b, t / 0.4);
  if (t < 0.8) return mix(b, c, (t - 0.4) / 0.4);
  return mix(c, d, (t - 0.8) / 0.2);
}
void main(){
  float size = aInfo.x, seed = aInfo.y, kind = aInfo.z, param = aInfo.w;
  vec3 p, col; float bright = 1.0; vSoft = 0.0;
  float s = smoothstep(0.0, 1.0, clamp(uScatter * 1.6 - seed * 0.6, 0.0, 1.0));
  float t = smoothstep(0.0, 1.0, clamp(uText * 1.6 - seed * 0.6, 0.0, 1.0));
  float ph = smoothstep(0.0, 1.0, clamp(uPhoto * 1.6 - seed * 0.6, 0.0, 1.0));

  if (kind > 5.5 && kind < 6.5){                   // 远处散景
    p = aTree + vec3(sin(uTime * 0.05 + seed * 20.0) * 2.0, cos(uTime * 0.04 + seed * 30.0) * 1.5, 0.0);
    col = aColor; bright = 0.05 + 0.03 * sin(uTime * 0.3 + seed * 10.0);
    vSoft = 1.0;
  } else if (kind > 4.5 && kind < 5.5){            // 星尘
    p = aTree;
    p.y = mod(p.y - uTime * (0.2 + seed * 0.35) + 10.0, 20.0) - 10.0;
    p.x += sin(uTime * 0.3 + seed * 40.0) * 0.5;
    col = mix(vec3(0.85, 0.85, 1.0), vec3(1.0, 0.85, 0.95), seed);
    float tw = pow(0.5 + 0.5 * sin(uTime * (1.0 + seed * 3.0) + seed * 80.0), 6.0);
    bright = 0.15 + tw * 0.9;
  } else {
    vec3 sc = aScatter;
    sc.xz = rot(sc.xz, uTime * 0.2 / (0.4 + length(sc.xz) * 0.09));
    sc.y += sin(uTime * 0.6 + seed * 30.0) * 0.4;
    vec3 tr = aTree;
    p = mix(tr, sc, s);
    p += normalize(tr + vec3(0.001, 0.3, 0.001)) * sin(s * 3.14159) * (1.5 + seed * 3.5);
    p.xz = rot(p.xz, uYaw);
    vec3 tx = aText + vec3(sin(uTime * 1.3 + seed * 40.0), cos(uTime * 1.1 + seed * 20.0), 0.0) * 0.03;
    p = mix(p, tx, t);

    float shimmer = sin(uTime * 0.6 + seed * 6.0 + aTree.y * 0.8) * 0.12;
    float tw = 0.65 + 0.35 * sin(uTime * (1.2 + seed * 3.0) + seed * 60.0);
    if (kind < 0.5){                               // 树身
      col = dream(param + shimmer) * aColor.r; bright = tw * 1.3;
    } else if (kind < 1.5){                        // 光带：珍珠白 + 彩虹光泽在上面流动
      float chase = 0.5 + 0.5 * sin(param * 40.0 - uTime * 2.8);
      col = mix(vec3(1.0), dream(fract(param * 2.0 - uTime * 0.15)), 0.45);
      bright = 0.35 + chase * chase * 1.2;
    } else if (kind < 2.5){                        // 珍珠
      col = aColor; bright = 0.8 + 0.4 * sin(uTime * 1.6 + seed * 50.0); vSoft = 0.5;
    } else if (kind < 3.5){                        // 星星
      col = aColor;
      bright = param > 0.5 ? (0.09 + 0.03 * sin(uTime * 1.5 + seed * 6.0)) * (1.0 - s) : 1.15 + 0.25 * sin(uTime * 2.5 + seed * 10.0);
      vSoft = param > 0.5 ? 1.0 : 0.0;
    } else {                                       // 光环
      col = dream(0.15 + param * 0.6) * 0.55; bright = tw;
    }
    // 变成文字时：淡紫白色调
    col = mix(col, mix(vec3(1.0, 0.92, 1.0), vec3(0.86, 0.8, 1.0), seed), t * 0.75);
    bright *= 1.0 + t * 0.4 + s * 0.15;
    // 变成照片：位置 = 照片像素，亮度 = 照片明暗
    vec3 pp = aPhoto.xyz + vec3(sin(uTime * 0.9 + seed * 40.0), cos(uTime * 0.8 + seed * 20.0), 0.0) * 0.02;
    p = mix(p, pp, ph);
    float lum = aPhoto.w;
    col = mix(col, mix(vec3(0.78, 0.7, 1.0), vec3(1.0, 0.97, 1.0), lum), ph);
    bright = mix(bright, 0.08 + pow(lum, 1.3) * 1.35, ph);
    if (kind > 2.5 && kind < 3.5 && param > 0.5) bright *= 1.0 - ph;
    size = mix(size, min(size, 2.6) * 0.95, ph);
    if (kind > 6.5) bright *= ph;                  // 额外的照片粒子：只在照片模式亮起
  }
  vec4 mv = uView * vec4(p, 1.0);
  gl_Position = uProj * mv;
  gl_PointSize = size * uPR * (uH / 900.0) * (22.0 / max(0.5, -mv.z));
  vColor = col * bright;
}`;
const FS = `
precision mediump float;
varying vec3 vColor;
varying float vSoft;
void main(){
  vec2 c = gl_PointCoord - 0.5;
  float d = dot(c, c) * 4.0;
  if (d > 1.0) discard;
  float core = exp(-d * 7.0) * 1.3;
  float halo = exp(-d * 2.2) * 0.25;
  float soft = smoothstep(1.0, 0.2, d);            // 散景/光晕：柔边圆
  float a = mix(core + halo, soft, vSoft);
  vec3 col = vColor * a;
  gl_FragColor = vec4(col, clamp(max(col.r, max(col.g, col.b)), 0.0, 1.0));
}`;
function shader(type, src){
  const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, shader(gl.VERTEX_SHADER, VS)); gl.attachShader(prog, shader(gl.FRAGMENT_SHADER, FS));
gl.linkProgram(prog);
if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
gl.useProgram(prog);
function attr(name, data, size, dynamic){
  const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, data, dynamic ? gl.DYNAMIC_DRAW : gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(prog, name);
  gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, size, gl.FLOAT, false, 0, 0);
  return buf;
}
attr("aTree", new Float32Array(P.tree), 3);
attr("aScatter", new Float32Array(P.scatter), 3);
attr("aColor", new Float32Array(P.color), 3);
attr("aInfo", new Float32Array(P.info), 4);
let textBuf = null;
const U = {};
["uProj","uView","uTime","uYaw","uScatter","uText","uPhoto","uPR","uH"].forEach(n => U[n] = gl.getUniformLocation(prog, n));
gl.disable(gl.DEPTH_TEST); gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE); gl.clearColor(0, 0, 0, 0);

/* ---------- 相机 ---------- */
const FOV = 45 * Math.PI / 180;
let camDist = 17, userZoom = 1, pitch = 0.1, yaw = 0, yawVel = 0;
function autoDist(){
  const asp = innerWidth / innerHeight, t = Math.tan(FOV / 2);
  return Math.max(17 / (2 * t), 12 / (2 * t * asp));
}
function perspective(fov, asp, n, f){
  const t = 1 / Math.tan(fov / 2), nf = 1 / (n - f);
  return new Float32Array([t/asp,0,0,0, 0,t,0,0, 0,0,(f+n)*nf,-1, 0,0,2*f*n*nf,0]);
}
const sub = (a,b) => [a[0]-b[0],a[1]-b[1],a[2]-b[2]], dot = (a,b) => a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const cross = (a,b) => [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];
const norm = a => { const l = Math.hypot(...a) || 1; return a.map(v => v / l); };
function lookAt(e, c, up){
  const z = norm(sub(e, c)), x = norm(cross(up, z)), y = cross(z, x);
  return new Float32Array([x[0],y[0],z[0],0, x[1],y[1],z[1],0, x[2],y[2],z[2],0, -dot(x,e),-dot(y,e),-dot(z,e),1]);
}
function resize(){
  canvas.width = innerWidth * PR; canvas.height = innerHeight * PR;
  gl.viewport(0, 0, canvas.width, canvas.height);
  camDist = autoDist() * userZoom;
  gl.uniformMatrix4fv(U.uProj, false, perspective(FOV, innerWidth / innerHeight, 0.1, 120));
  gl.uniform1f(U.uPR, PR); gl.uniform1f(U.uH, innerHeight);
  buildText();
}

/* ---------- 状态 ---------- */
let scatter = 1, scatterTarget = 1, text = 0, textTarget = 0, textTimer, burstTimer, handActive = false;
let photo = 0, photoTarget = 0, photoTimer;
function showText(){
  if (photoTarget) return;
  textTarget = 1; scatterTarget = 0; clearTimeout(textTimer);
  textTimer = setTimeout(() => textTarget = 0, CONFIG.textHold);
}
function showPhoto(){
  if (!photoReady) return;
  photoTarget = 1; textTarget = 0; scatterTarget = 0; clearTimeout(photoTimer); clearTimeout(textTimer);
  photoTimer = setTimeout(() => photoTarget = 0, CONFIG.photoHold);
}
setTimeout(() => { if (!handActive) scatterTarget = 0; }, 800);   // 开场：星云聚成树

/* ---------- 备用：没有摄像头时也能用鼠标/手指（不显示任何按钮） ---------- */
const pointers = new Map(); let downX = 0, downY = 0, downT = 0, moved = false, lastTap = 0;
let pressTimer;
canvas.addEventListener("pointerdown", e => {
  canvas.setPointerCapture(e.pointerId); pointers.set(e.pointerId, [e.clientX, e.clientY]);
  downX = e.clientX; downY = e.clientY; downT = performance.now(); moved = false;
  clearTimeout(pressTimer); pressTimer = setTimeout(() => { if (!moved && pointers.size) { moved = true; showPhoto(); } }, 650);   // 长按 = 照片
});
addEventListener("keydown", e => { if (e.key === "p" || e.key === "P") showPhoto(); if (e.key === "t" || e.key === "T") showText(); });
canvas.addEventListener("pointermove", e => {
  if (!pointers.has(e.pointerId)) return;
  const prev = pointers.get(e.pointerId); pointers.set(e.pointerId, [e.clientX, e.clientY]);
  if (Math.abs(e.clientX - downX) + Math.abs(e.clientY - downY) > 6) moved = true;
  const dx = e.clientX - prev[0]; yaw += dx * 0.0055; yawVel = dx * 0.0055;
  pitch = Math.min(0.7, Math.max(-0.2, pitch + (e.clientY - prev[1]) * 0.003));
});
canvas.addEventListener("pointerup", e => {
  pointers.delete(e.pointerId); clearTimeout(pressTimer);
  if (moved || performance.now() - downT > 350 || handActive) return;
  const now = performance.now();
  if (now - lastTap < 320){ clearTimeout(burstTimer); scatterTarget = 0; showText(); lastTap = 0; return; }   // 双击 = 文字
  lastTap = now;
  burstTimer = setTimeout(() => { scatterTarget = 1; setTimeout(() => scatterTarget = 0, 1900); }, 320);   // 单击 = 炸开
});
canvas.addEventListener("wheel", e => { e.preventDefault(); userZoom = Math.min(1.8, Math.max(.55, userZoom * (1 + e.deltaY * .001))); camDist = autoDist() * userZoom; }, {passive:false});

/* ---------- 🖐 手势 ---------- */
let mergeFrames = 0, landmarker = null, lastVideoTime = -1, lastHandSeen = 0, openSmooth = 0, handX = .5, pinchArmed = true, lastPinch = 0, everSawHand = false;
const video = document.getElementById("video"), camBox = document.getElementById("cam");
const camCanvas = document.getElementById("camCanvas"), cctx = camCanvas.getContext("2d");

async function startHands(){
  toast("✨ 正在唤醒魔法…", 0);
  try{
    const mp = await import("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14");
    const fileset = await mp.FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
    landmarker = await mp.HandLandmarker.createFromOptions(fileset, {
      baseOptions: { modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task", delegate: "GPU" },
      runningMode: "VIDEO", numHands: 2,
    });
    const stream = await navigator.mediaDevices.getUserMedia({video: {width: 640, height: 480, facingMode: "user"}});
    video.srcObject = stream; await video.play();
    handActive = true;
    if (CONFIG.showCamera) camBox.classList.add("show");
    toast("把手举到镜头前 ✋", 6000);
  } catch(err){
    console.error(err);
    toast("摄像头没有打开<br>也可以拖动旋转 · 单击炸开 · 双击出字", 6000);
  }
}

function updateHands(now){
  if (!handActive || video.readyState < 2 || video.currentTime === lastVideoTime) return;
  lastVideoTime = video.currentTime;
  const res = landmarker.detectForVideo(video, now);
  if (CONFIG.showCamera){ cctx.globalAlpha = .6; cctx.drawImage(video, 0, 0, camCanvas.width, camCanvas.height); cctx.globalAlpha = 1; }
  const hands = res.landmarks || [];
  const lm = hands[0];
  if (!lm){
    mergeFrames = 0;
    if (now - lastHandSeen > 700){ yawVel *= 0.9; }
    return;
  }
  // 🙏 两只手掌心相对、合在一起 = 照片
  if (hands.length >= 2){
    const a = hands[0], b = hands[1];
    const sizeA = Math.hypot(a[0].x - a[9].x, a[0].y - a[9].y), sizeB = Math.hypot(b[0].x - b[9].x, b[0].y - b[9].y);
    const gap = Math.hypot(a[9].x - b[9].x, a[9].y - b[9].y) / ((sizeA + sizeB) / 2 || .001);
    mergeFrames = gap < 1.1 ? mergeFrames + 1 : 0;
    if (mergeFrames >= 5){ if (!photoTarget) showPhoto(); else { clearTimeout(photoTimer); photoTimer = setTimeout(() => photoTarget = 0, CONFIG.photoHold); } }
    if (CONFIG.showCamera){
      cctx.fillStyle = mergeFrames ? "#ffe6fb" : "#d8c8ff";
      for (const q of b){ cctx.beginPath(); cctx.arc(q.x * camCanvas.width, q.y * camCanvas.height, 3, 0, 6.28); cctx.fill(); }
    }
    lastHandSeen = now;
    if (mergeFrames || photoTarget){ yawVel *= 0.9; return; }    // 合十的时候不炸开、不旋转
  } else mergeFrames = 0;
  if (photoTarget){ lastHandSeen = now; return; }
  everSawHand = true;
  lastHandSeen = now;
  const d = (a, b) => Math.hypot(lm[a].x - lm[b].x, lm[a].y - lm[b].y);
  const palm = d(0, 9) || .001;
  const ext = i => d(i, 0) / palm;                       // 指尖离手腕的距离（越大 = 越伸直）
  const others = (ext(12) + ext(16) + ext(20)) / 3;
  const pinchDist = d(4, 8) / palm;

  // 👌 手指捏一下（拇指碰食指，其他手指伸直）= 出现文字
  const isPinch = pinchDist < 0.3 && others > 1.5;
  if (isPinch && pinchArmed && now - lastPinch > 1200){ showText(); pinchArmed = false; lastPinch = now; }
  if (pinchDist > 0.5) pinchArmed = true;

  // ✋ 张开 / ✊ 握拳 = 炸开 / 合成树（文字显示时先不管）
  if (!isPinch && textTarget === 0){
    const ratio = (ext(8) + ext(12) + ext(16) + ext(20)) / 4;
    const open = Math.min(1, Math.max(0, (ratio - 1.15) / (1.8 - 1.15)));
    openSmooth += (open - openSmooth) * 0.25;
    scatterTarget = openSmooth > 0.55 ? 1 : openSmooth < 0.3 ? 0 : scatterTarget;
  }

  // 👈👉 手掌往左 / 往右 = 树往左 / 往右转（中间一小段是停）
  handX += (lm[9].x - handX) * 0.25;
  let off = handX - 0.5;                                  // 摄像头画面没镜像：你的手往左，x 变大
  off = Math.sign(off) * Math.max(0, Math.abs(off) - 0.08);
  yawVel = off * 0.11 * CONFIG.rotateSpeed * (CONFIG.flipRotate ? -1 : 1);

  if (CONFIG.showCamera){
    cctx.fillStyle = isPinch ? "#ffd1f0" : "#d8c8ff";
    for (const q of lm){ cctx.beginPath(); cctx.arc(q.x * camCanvas.width, q.y * camCanvas.height, 3, 0, 6.28); cctx.fill(); }
  }
}

/* ---------- 主循环 ---------- */
textBuf = attr("aText", textArr, 3, true);
photoBuf = attr("aPhoto", photoArr, 4, true);
resize(); addEventListener("resize", () => { resize(); layoutPhoto(); });
loadPhoto();
if (document.fonts) document.fonts.ready.then(buildText);

let last = performance.now();
function frame(now){
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  updateHands(now);
  scatter += (scatterTarget - scatter) * (1 - Math.pow(0.03, dt));
  text += (textTarget - text) * (1 - Math.pow(0.03, dt));
  photo += (photoTarget - photo) * (1 - Math.pow(0.04, dt));
  if (!pointers.size){
    if (handActive && now - lastHandSeen < 700) yaw += yawVel * dt * 60;
    else { yaw += yawVel + 0.1 * dt; yawVel *= Math.pow(0.05, dt); }   // 没有手的时候慢慢自转
  }
  const eye = [0, Math.sin(pitch) * camDist + 0.9, Math.cos(pitch) * camDist];
  gl.uniformMatrix4fv(U.uView, false, lookAt(eye, [0, 0.9, 0], [0, 1, 0]));
  gl.uniform1f(U.uTime, now / 1000); gl.uniform1f(U.uYaw, yaw);
  gl.uniform1f(U.uScatter, scatter); gl.uniform1f(U.uText, text); gl.uniform1f(U.uPhoto, photo);
  gl.clear(gl.COLOR_BUFFER_BIT);
  gl.drawArrays(gl.POINTS, 0, COUNT);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
startHands();
</script>
</body>
</html>
